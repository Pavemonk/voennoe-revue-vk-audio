}

android {
    namespace 'ru.radiokp.voennoerevue'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.radiokp.voennoerevue'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
}
